<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sorry ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
    body {
        margin:0;
        background: #0d0017;
        font-family: 'Poppins', sans-serif;
        overflow:hidden;
    }

    /* Pink fog */
    #fog {
        position:absolute;
        width:200%;
        height:200%;
        background:radial-gradient(circle, rgba(255,120,160,0.15), transparent 70%);
        filter:blur(80px);
        animation:fogMove 18s infinite linear;
        z-index:0;
    }
    @keyframes fogMove {
        0% { transform:translate(-20%, -20%); }
        50% { transform:translate(10%, 10%); }
        100% { transform:translate(-20%, -20%); }
    }

    canvas {
        position:absolute;
        top:0; left:0;
        width:100vw;
        height:100vh;
        z-index:2;
        transition: transform 1.3s ease-in-out;
    }
    .heartBeat { animation:beat 1.8s infinite ease-in-out; }
    @keyframes beat {
        0% { transform:scale(1); }
        25% { transform:scale(1.03); }
        50% { transform:scale(1); }
        75% { transform:scale(1.04); }
        100% { transform:scale(1); }
    }

    .floatHeart {
        position:absolute;
        color:rgba(255,80,120,0.50);
        font-size:20px;
        animation: floatUp 6s linear infinite;
        text-shadow:0 0 10px rgba(255,0,0,0.5);
        z-index:4;
    }
    @keyframes floatUp {
        0% { transform:translateY(0) scale(1); opacity:1; }
        100% { transform:translateY(-300px) scale(1.6); opacity:0; }
    }

    /* MESSAGE */
    #messageBox {
        position:absolute;
        width:60vw;
        max-width:520px;
        text-align:center;
        left:50%;
        top:45%;   /* stays inside heart */
        transform:translate(-50%, -50%);
        color:#ff3d63;
        font-size:17px;
        line-height:1.45;
        text-shadow:0 0 12px rgba(255,0,60,0.8);
        z-index:6;
    }
    #typing { white-space: pre-line; }

    /* SORRY — now PERFECT MIDDLE */
    #sorry {
        position:absolute;
        bottom:120px;   /* PERFECT SPOT between message & button */
        width:100%;
        text-align:center;
        font-family:'Pacifico', cursive;
        font-size:65px;
        color:#ff7ab4;
        text-shadow:0 0 20px rgba(255,120,170,0.6);
        z-index:6;
    }

    #forgiveBtn {
        position:absolute;
        bottom:55px;  /* stays below SORRY */
        left:50%;
        transform:translateX(-50%);
        padding:12px 26px;
        background:#ff6aa9;
        color:white;
        border:none;
        border-radius:40px;
        font-size:18px;
        cursor:pointer;
        z-index:6;
    }

    #thankYou, #loveYou {
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%, -50%);
        font-family:'Pacifico', cursive;
        font-size:70px;
        color:#ff4a6e;
        white-space:pre;
        display:none;
        text-shadow:0 0 25px rgba(255,40,70,0.9);
        z-index:30;
    }

    #moreBtn {
        position:absolute;
        bottom:25px;
        left:50%;
        transform:translateX(-50%);
        padding:12px 26px;
        background:#ff3d63;
        color:white;
        border:none;
        border-radius:40px;
        font-size:18px;
        cursor:pointer;
        display:none;
        z-index:20;
    }

    .petal {
        position:absolute;
        width:18px;
        height:18px;
        background:url('https://i.imgur.com/0Q9Y9Hk.png') no-repeat center/contain;
        animation: fall 4s linear forwards;
        z-index:200;
    }
    @keyframes fall {
        0% { transform:translateY(-50px) rotate(0deg); }
        100% { transform:translateY(120vh) rotate(360deg); opacity:0; }
    }

</style>
</head>

<body>

<div id="fog"></div>

<canvas id="c" class="heartBeat"></canvas>

<div id="messageBox"><div id="typing"></div></div>

<div id="sorry">SORRY</div>
<button id="forgiveBtn">Will you forgive me?</button>

<div id="thankYou"></div>
<button id="moreBtn">Ek aur baat bolni thi 👉👈 , Boldu kya??</button>

<div id="loveYou"></div>

<script>

/* HEART CANVAS */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); onresize = resize;

function hx(t){ return 15 * Math.sin(t)**3; }
function hy(t){
    return 12*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
}

const pts = [];
for(let i=0;i<1200;i++){
    const t = i/1199 * Math.PI*2;
    pts.push({x:hx(t), y:hy(t)});
}

let prog=0,last=0;

function draw(now){
    if(!last) last=now;
    prog+= (now-last)/1000 * 0.25;
    last=now;
    if(prog>1) prog=1;

    ctx.clearRect(0,0,innerWidth,innerHeight);

    const cx=innerWidth/2, cy=innerHeight/2+40;
    const scale=Math.min(innerWidth,innerHeight)/22;

    ctx.beginPath();
    pts.forEach((p,i)=>{
        const x=cx+p.x*scale, y=cy-p.y*scale;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle="rgba(255,120,170,0.2)";
    ctx.fill();

    ctx.beginPath();
    ctx.lineWidth=5; ctx.lineCap="round";
    ctx.strokeStyle="#ff5b9a";
    const upto=Math.floor(prog*(pts.length-1));
    for(let i=0;i<=upto;i++){
        const p=pts[i];
        const x=cx+p.x*scale, y=cy-p.y*scale;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();

    requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* TYPING */
const msg =
`I’m really sorry for what I said earlier.
Mera intention bilkul galat nahi tha, bas baat ko mazaak mein bol diya aur wo wrong way mein chali gayi.
I genuinely didn’t want to hurt you.
Tu important hai yaar, isliye jab tujhe bura laga toh mujhe bhi feel hua.
Aage se main dhyaan rakhunga. Ek baar phirse sorrry madam 🥺`;

let i=0;
(function type(){
    if(i<msg.length){
        typing.textContent+=msg[i++];
        setTimeout(type,28);
    }
})();

/* Floating Hearts */
setInterval(()=>{
    const h=document.createElement("div");
    h.className="floatHeart";
    h.innerHTML="❤";
    h.style.left=Math.random()*innerWidth+"px";
    h.style.top=(innerHeight-60)+"px";
    h.style.fontSize=(20+Math.random()*30)+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
},600);

/* FIRST BUTTON */
forgiveBtn.onclick=()=>{
    messageBox.style.display="none";
    forgiveBtn.style.display="none";
    sorry.style.display="none";

    const t="Thank you Madam💖";
    thankYou.style.display="block";

    let j=0;
    (function write(){
        if(j<t.length){
            thankYou.textContent+=t[j++];
            setTimeout(write,70);
        }
    })();

    setTimeout(()=>moreBtn.style.display="block",1500);
};

/* SECOND BUTTON */
moreBtn.onclick=()=>{
    moreBtn.style.display="none";
    thankYou.style.display="none";
    c.style.transform="scale(1.06)";

    const t="I love you the most Madam 💖💎";
    loveYou.style.display="block";

    let k=0;
    (function typeLove(){
        if(k<t.length){
            loveYou.textContent+=t[k++];
            setTimeout(typeLove,65);
        }
    })();

    for(let n=0;n<40;n++){
        setTimeout(()=>{
            const p=document.createElement("div");
            p.className="petal";
            p.style.left=Math.random()*innerWidth+"px";
            p.style.top="-20px";
            document.body.appendChild(p);
            setTimeout(()=>p.remove(),4000);
        },n*120);
    }
};

</script>

</body>
</html>
